name: build.yml
on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: run checkstyle
        run: bash ./gradlew checkstyleMain checkstyleTest
      - name: run tests
        run: bash ./gradlew :bv-app:quarkusTest
      - name: run build
        run: bash ./gradlew :bv-app:build -x :bv-app:test
