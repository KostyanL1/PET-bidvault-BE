info:
  name: Create
  type: http
  seq: 1

http:
  method: POST
  url: "{{host}}/api/auction/create"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "title": "Old guitar",
        "description": "Vintage acoustic guitar with warm tone and worn wooden finish.",
        "startPrice": 100,
        "duration": 900
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        if (body.room?.id) {
          bru.setEnvVar("roomId", body.room.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
