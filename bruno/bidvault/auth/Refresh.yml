info:
  name: Refresh
  type: http
  seq: 3

http:
  method: POST
  url: "{{host}}/api/auth/refresh"
  body:
    type: json
    data: ""

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        bru.setEnvVar("accessToken", body.accessToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
