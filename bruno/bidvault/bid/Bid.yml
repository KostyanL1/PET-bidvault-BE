info:
  name: Bid
  type: http
  seq: 1

http:
  method: GET
  url: "{{host}}/api/bid"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "roomId": "{{roomId}}",
        "amount": "10"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
